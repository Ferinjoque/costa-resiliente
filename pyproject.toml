[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "UP",             # pyupgrade
    "B",              # bugbear
    "S",              # bandit security
    "N",              # naming conventions
]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # allow function calls in default args (FastAPI Depends)
]
exclude = ["notebooks/", "data/", ".venv/"]

[tool.ruff.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.black]
target-version = ["py312"]
line-length = 100
exclude = '''
/(
    \.git
  | \.venv
  | data
  | notebooks
  | node_modules
)/
'''

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/workers/tests"]
addopts = "--import-mode=importlib"
