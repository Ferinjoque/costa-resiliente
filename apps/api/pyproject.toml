[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "costa-api"
version = "0.1.0"
description = "Costa Resiliente — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "geoalchemy2>=0.14",

    # Redis
    "redis[hiredis]>=5.0",

    # MinIO / S3
    "aiobotocore>=2.13",
    "boto3>=1.34",

    # Geospatial
    "shapely>=2.0",
    "pyproj>=3.6",
    "geojson-pydantic>=1.0",

    # HTTP client
    "httpx>=0.27",

    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",

    # Utilities
    "python-multipart>=0.0.9",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "black>=24.0",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]
