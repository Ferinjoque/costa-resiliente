[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "costa-workers"
version = "0.1.0"
description = "Costa Resiliente — Prefect ingestion flows + ML workers"
requires-python = ">=3.12"
dependencies = [
    # Orchestration
    "prefect>=3.0,<4",
    "prefect-sqlalchemy>=0.5",

    # Data access
    "pystac-client>=0.8",
    "pystac>=1.10",
    "odc-stac>=0.3",
    "stackstac>=0.5",

    # Geospatial processing
    "h5py>=3.11",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2024.1",
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",

    # ML
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "lightgbm>=4.3",
    "torch>=2.3",
    "torchvision>=0.18",
    "transformers>=4.40",
    "huggingface-hub>=0.23",

    # NLP / PII redaction
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",

    # Storage
    "boto3>=1.34",
    "aiobotocore>=2.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "geoalchemy2>=0.14",
    "redis[hiredis]>=5.0",

    # Social feeds
    "praw>=7.7",
    "atproto>=0.0.50",     # Bluesky AT Protocol
    "feedparser>=6.0",     # RSS
    "telethon>=1.36",      # Telegram

    # HTTP
    "httpx>=0.27",
    "tenacity>=8.3",

    # Pydantic
    "pydantic>=2.7",
    "pydantic-settings>=2.2",

    # Utilities
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.setuptools.packages.find]
where = ["src"]
